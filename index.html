<style>
:root{--paper:#FBF4E3;--ink:#1C1B1F;--red:#E0362E;--green:#0F7B4B;--tape:rgba(255,210,80,.55);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:var(--green);font-family:-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;display:flex;flex-direction:column;align-items:center;padding:36px 16px 60px}
h1{font-size:30px;color:#fff;text-align:center;text-shadow:3px 3px 0 rgba(0,0,0,.18);margin-bottom:4px}
.sub{color:rgba(255,255,255,.88);font-size:14px;text-align:center;margin-bottom:24px}
.card{position:relative;width:min(360px,100%);background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:7px 7px 0 var(--ink);padding:24px 20px 20px;transform:rotate(-1deg)}
.card::before{content:"";position:absolute;top:-16px;left:50%;width:84px;height:26px;background:var(--tape);border:1px solid rgba(0,0,0,.1);transform:translateX(-50%) rotate(-3deg)}
.box{border:3px solid var(--ink);border-radius:6px;overflow:hidden;background:#fffdf7;aspect-ratio:1/1;position:relative}
canvas{display:block;width:100%;height:100%}
#guide{position:absolute;inset:0;pointer-events:none}#draw{touch-action:none;cursor:crosshair;position:absolute;inset:0}
.lvs{display:flex;gap:8px;margin-bottom:14px}.lv{flex:1;font:700 14px inherit;font-family:inherit;padding:9px 4px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:8px;cursor:pointer}.lv.on{background:var(--ink);color:#fff}
.row{display:flex;gap:14px;margin-top:20px}
.btn{flex:1;font:700 15px inherit;font-family:inherit;padding:13px 10px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.pri{background:var(--red);color:#fff}
#hint{margin-top:12px;font-size:13px;text-align:center;opacity:.75;min-height:16px;font-weight:600}
#res{display:none;transform:rotate(1.2deg)}
#label{font-size:28px;color:var(--red);text-align:center;line-height:1.3;margin-bottom:6px}
#pct{text-align:center;font-size:13px;opacity:.6;margin-bottom:12px}
.legend{display:flex;justify-content:center;gap:16px;font-size:12px;margin-top:10px;font-weight:600}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
span{ color: black;}
.wm{display:block;width:170px;max-width:60%;height:auto;opacity:.5;pointer-events:none}
.wmwrap{margin-top:44px;display:flex;justify-content:center;width:100%}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tb{flex:1;font:700 13px inherit;font-family:inherit;padding:8px 4px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:8px;cursor:pointer}
.tb:disabled{opacity:.35}
#main.fs{position:fixed;inset:0;z-index:50;width:100%;border:0;border-radius:0;box-shadow:none;transform:none;overflow-y:auto;display:flex;flex-direction:column;align-items:stretch;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px))}
#main.fs::before{display:none}
#main.fs .box{width:min(100%,max(200px,calc(100vh - 240px)));width:min(100%,max(200px,calc(100dvh - 240px)));align-self:center;flex:none}
#main.fs .row{margin-top:12px}
#loupe{display:none;position:fixed;width:120px;height:120px;border-radius:50%;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);overflow:hidden;z-index:100;pointer-events:none;background:#fffdf7}
#loupe canvas{width:100%;height:100%}
</style></head><body>
<h1>বাংলাদেশ আঁকো</h1>
<div class="sub">মোড বেছে নিয়ে বর্ডার আঁকো</div>
<div class="card" id="main">
 <div class="lvs"><button class="lv on" data-l="trace">ট্রেস</button><button class="lv" data-l="memory">স্মৃতি</button><button class="lv" data-l="scratch">শুরু থেকে</button></div>
 <div class="tools"><button class="tb" id="btnUndo">↩ আনডু</button><button class="tb" id="btnRedo">↪ রিডু</button><button class="tb" id="btnFs">⛶ বড় করো</button></div>
 <div class="box"><canvas id="guide" width="300" height="300"></canvas><canvas id="draw" width="300" height="300"></canvas></div>
 <div class="row"><button class="btn" id="clr">আবার আঁকো</button><button class="btn pri" id="go">যাচাই করো</button></div>
 <div id="hint">&nbsp;</div>
</div>
<div class="card" id="res">
 <div id="label"></div><div id="pct"></div>
 <div class="box"><canvas id="cmp" width="300" height="300"></canvas></div>
 <div class="legend"><span><i style="background:#2F8F5B"></i>আসল</span><span><i style="background:#E0362E"></i>তোমার</span></div>
 <button class="btn pri" id="again" style="width:100%;margin-top:18px">আরেকবার আঁকি</button>
</div>

const TIERS=[[0,'এইটা বাংলাদেশ?? 😂'],[.2,'কি ধন আঁকলা মিয়া? 😂'],[.35,'মোটামুটি'],[.48,'খারাপ না'],[.58,'ভালো'],[.68,'সুন্দর হইছে'],[.76,'চমৎকার!'],[.84,'অসাধারণ ভাই ✨'],[.91,'তুমি কি জিওগ্রাফির স্যার? 😦']];
const dc=document.getElementById('draw'),dx=dc.getContext('2d');
dx.lineCap=dx.lineJoin='round';dx.lineWidth=LW;dx.strokeStyle='#1C1B1F';
let down=false,pts=[],len=0,strokes=[],redoS=[];
const hint=t=>document.getElementById('hint').textContent=t||'\u00A0';
function pos(e){const r=dc.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*S/r.width,(t.clientY-r.top)*S/r.height]}
function start(e){e.preventDefault();if(locked)return;down=true;const p=pos(e);pts.push(p);strokes.push([p]);redoS.length=0;upd();dx.beginPath();dx.arc(p[0],p[1],LW/2,0,7);dx.fillStyle='#1C1B1F';dx.fill();if(e.touches)loupe(e,p)}
function move(e){if(!down)return;e.preventDefault();const p=pos(e),q=pts[pts.length-1];dx.beginPath();dx.moveTo(q[0],q[1]);dx.lineTo(p[0],p[1]);dx.stroke();len+=Math.hypot(p[0]-q[0],p[1]-q[1]);pts.push(p);strokes[strokes.length-1].push(p);if(e.touches)loupe(e,p)}
dc.addEventListener('mousedown',start);dc.addEventListener('mousemove',move);addEventListener('mouseup',()=>down=false);
dc.addEventListener('touchstart',start,{passive:false});dc.addEventListener('touchmove',move,{passive:false});dc.addEventListener('touchend',()=>{down=false;hideL()});dc.addEventListener('touchcancel',()=>{down=false;hideL()});
const lo=document.getElementById('loupe'),lx=document.getElementById('lp').getContext('2d'),Z=2.5,LS=120;
function hideL(){lo.style.display='none'}
function loupe(e,p){
 const t=e.touches[0],r=dc.getBoundingClientRect(),sc=r.width/S,src=LS/(Z*sc),k=240/src;
 lx.fillStyle='#fffdf7';lx.fillRect(0,0,240,240);
 for(const c of [gc,dc])lx.drawImage(c,p[0]-src/2,p[1]-src/2,src,src,0,0,240,240);
 lx.strokeStyle='#E0362E';lx.lineWidth=2;lx.beginPath();
 lx.moveTo(120,96);lx.lineTo(120,108);lx.moveTo(120,132);lx.lineTo(120,144);lx.moveTo(96,120);lx.lineTo(108,120);lx.moveTo(132,120);lx.lineTo(144,120);lx.stroke();
 lx.beginPath();lx.arc(120,120,Math.max(3,LW/2*k),0,7);lx.stroke();
 let cx=t.clientX,cy=t.clientY-100;
 if(cy<LS/2+8){cy=t.clientY;cx+=(t.clientX<innerWidth/2?1:-1)*90}
 cx=Math.min(innerWidth-LS/2-4,Math.max(LS/2+4,cx));cy=Math.max(LS/2+4,cy);
 lo.style.left=(cx-LS/2)+'px';lo.style.top=(cy-LS/2)+'px';lo.style.display='block'}
function clear(){dx.clearRect(0,0,S,S);pts=[];strokes=[];redoS.length=0;len=0;hint('');upd()}
const gc=document.getElementById('guide'),gx=gc.getContext('2d');
const DOTS=[['ঢাকা',90.41,23.81],['সিলেট',91.87,24.90],['কক্সবাজার',91.98,21.45],['রাজশাহী',88.60,24.37]];
function drawGuide(showMap,showDots){
 gx.clearRect(0,0,S,S);
 const K=Math.cos(23.7*Math.PI/180),ring=LEVELS.high,all=fit(ring.concat(DOTS.map(d=>[d[1]*K,-d[2]]))),k=S/N,rg=all.slice(0,ring.length),dt=all.slice(ring.length);
 if(showMap){gx.beginPath();rg.forEach(([p,q],i)=>i?gx.lineTo(p*k,q*k):gx.moveTo(p*k,q*k));gx.closePath();gx.fillStyle='rgba(15,123,75,.12)';gx.fill();gx.setLineDash([6,5]);gx.lineWidth=2;gx.strokeStyle='rgba(15,123,75,.7)';gx.stroke();gx.setLineDash([])}
 if(showDots){gx.font='bold 12px "Noto Sans Bengali",sans-serif';gx.textAlign='center';dt.forEach(([p,q],i)=>{gx.beginPath();gx.arc(p*k,q*k,4,0,7);gx.fillStyle='#E0362E';gx.fill();gx.fillStyle='#1C1B1F';gx.fillText(DOTS[i][0],p*k,q*k-9)})}}
function setLevel(l){mode=l;clearInterval(timer);locked=false;
 document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('on',b.dataset.l===l));clear();
 if(l==='trace'){drawGuide(true,true);hint('গাইডের ওপর দিয়ে আঁকো')}
 else if(l==='scratch'){drawGuide(false,true);hint('শুধু ডট দেখে আঁকো')}
 else{locked=true;drawGuide(true,true);let t=5;hint('ভালো করে দেখো… '+t);
  timer=setInterval(()=>{t--;if(t>0)hint('ভালো করে দেখো… '+t);else{clearInterval(timer);locked=false;drawGuide(false,true);hint('এবার মনে করে আঁকো!')}},1000)}}
const TOL={trace:8,memory:11,scratch:14};
function line(a,b,st){const d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d/st)),o=[];for(let k=0;k<=n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]);return o}
function fit(poly){let a=1e9,b=-1e9,c=1e9,e=-1e9;for(const[p,q]of poly){a=Math.min(a,p);b=Math.max(b,p);c=Math.min(c,q);e=Math.max(e,q)}
 const sc=(N-2*PAD)/Math.max(b-a,e-c),ox=(N-(b-a)*sc)/2,oy=(N-(e-c)*sc)/2;return poly.map(([p,q])=>[ox+(p-a)*sc,oy+(q-c)*sc])}
function near(p,arr){let m=1e9;for(const q of arr){const d=(p[0]-q[0])**2+(p[1]-q[1])**2;if(d<m)m=d}return Math.sqrt(m)}
function scoreOutline(){
 if(pts.length<5)return null;
 const fp=fit(pts),lens=strokes.map(s=>s.length),us=[];let i=0;
 for(const L of lens){const seg=fp.slice(i,i+L);i+=L;for(let k=0;k<seg.length-1;k++)us.push(...line(seg[k],seg[k+1],2))}
 us.push(...line(fp[fp.length-1],fp[0],2));
 const rf=fit(LEVELS.high),rs=[];
 for(let k=0;k<rf.length;k++)rs.push(...line(rf[k],rf[(k+1)%rf.length],2));
 const T=TOL[mode],sc=d=>Math.max(0,1-d/T);
 let a=0;for(const p of us)a+=sc(near(p,rs));a/=us.length;
 let b=0;for(const q of rs)b+=sc(near(q,us));b/=rs.length;
 return{s:Math.sqrt(a*b),fp,lens,rf}}
function showCmp2(r){const c=document.getElementById('cmp'),x=c.getContext('2d'),k=300/N;c.width=c.height=300;x.fillStyle='#fffdf7';x.fillRect(0,0,300,300);
 x.beginPath();r.rf.forEach(([p,q],i)=>i?x.lineTo(p*k,q*k):x.moveTo(p*k,q*k));x.closePath();x.fillStyle='rgba(47,143,91,.35)';x.fill();x.lineWidth=3;x.strokeStyle='#2F8F5B';x.stroke();
 x.strokeStyle='#E0362E';x.lineJoin=x.lineCap='round';let i=0;
 for(const L of r.lens){x.beginPath();r.fp.slice(i,i+L).forEach(([p,q],j)=>j?x.lineTo(p*k,q*k):x.moveTo(p*k,q*k));x.stroke();i+=L}
 const f=r.fp[0],l=r.fp[r.fp.length-1];x.beginPath();x.moveTo(l[0]*k,l[1]*k);x.lineTo(f[0]*k,f[1]*k);x.setLineDash([6,5]);x.stroke();x.setLineDash([])}
function upd(){document.getElementById('btnUndo').disabled=!strokes.length;document.getElementById('btnRedo').disabled=!redoS.length}
function redraw(){dx.clearRect(0,0,S,S);dx.lineWidth=LW;dx.strokeStyle=dx.fillStyle='#1C1B1F';len=0;
 for(const s of strokes){if(s.length===1){dx.beginPath();dx.arc(s[0][0],s[0][1],LW/2,0,7);dx.fill()}else{dx.beginPath();s.forEach(([x,y],i)=>i?dx.lineTo(x,y):dx.moveTo(x,y));dx.stroke();for(let i=1;i<s.length;i++)len+=Math.hypot(s[i][0]-s[i-1][0],s[i][1]-s[i-1][1])}}
 pts=strokes.flat();upd()}
document.getElementById('btnUndo').onclick=()=>{if(locked||!strokes.length)return;redoS.push(strokes.pop());redraw()};
document.getElementById('btnRedo').onclick=()=>{if(locked||!redoS.length)return;strokes.push(redoS.pop());redraw()};
function setFs(on){document.getElementById('main').classList.toggle('fs',on);document.body.style.overflow=on?'hidden':'';document.getElementById('btnFs').textContent=on?'✕ ছোট করো':'⛶ বড় করো'}
document.getElementById('btnFs').onclick=()=>setFs(!document.getElementById('main').classList.contains('fs'));
document.getElementById('clr').onclick=clear;
document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>setLevel(b.dataset.l));setLevel('trace');
document.getElementById('go').onclick=()=>{
 if(len<150){hint('আগে পুরো বর্ডার আঁকো!');return}
 const f=pts[0],l=pts[pts.length-1];dx.beginPath();dx.moveTo(l[0],l[1]);dx.lineTo(f[0],f[1]);dx.stroke();
 const r=scoreOutline();if(!r){hint('কিছু তো আঁকো!');return}
 const s=r.s;let t=TIERS[0][1];for(const[m,l2]of TIERS)if(s>=m)t=l2;
 document.getElementById('label').textContent=t;
 document.getElementById('pct').textContent='মিল: '+Math.round(s*100)+'%';
 showCmp2(r);setFs(false);main.style.display='none';res.style.display='block'};
const main=document.getElementById('main'),res=document.getElementById('res');
document.getElementById('again').onclick=()=>{res.style.display='none';main.style.display='block';setLevel(mode)};
</script></body></html>
